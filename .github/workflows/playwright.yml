name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install system dependencies for webkit
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libgbm-dev

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox webkit

      - name: Install LightPanda Browser
        run: |
          curl -L -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x ./lightpanda

      - name: Start LightPanda and run tests
        run: |
          ./lightpanda serve --headless --remote-debugging-port=9222 &
          LIGHTPANDA_PID=$!
          sleep 5
          bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          kill $LIGHTPANDA_PID || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
