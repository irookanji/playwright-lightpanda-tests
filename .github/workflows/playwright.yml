name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox webkit

      - name: Install LightPanda Browser
        run: |
          curl -L -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x ./lightpanda
          echo "LIGHTPANDA_PATH=$(pwd)/lightpanda" >> $GITHUB_ENV

      - name: Start LightPanda server
        run: |
          ./lightpanda serve --headless --remote-debugging-port=9222 &
          echo "LIGHTPANDA_PID=$!" >> $GITHUB_ENV
          # Wait for LightPanda to start
          sleep 3

      - name: Run Playwright tests
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Stop LightPanda
        if: always()
        run: kill $LIGHTPANDA_PID || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
